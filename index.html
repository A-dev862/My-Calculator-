<!DOCTYPE html>  
<html>  
  <head>  
    <title> My calculator</title>  
    <style>  
        body {  
          display: flex;  
justify-content: center;  
align-items: center;  
height: 100vh;  
margin: 0;  
background-color: #f2f2f2;  
font-family: Arial, sans-serif;

}

.calculator {
background-color: #222;
padding: 20px;
border-radius: 15px;
width: 280px;
}
#display {
width: 100%;
height: 60px;
box-sizing: border-box;
margin-bottom: 15px;
border: none;
border-radius: 8px;
font-size: 28px;
text-align: right;
padding: 10px;
}
.buttons {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
}
button {
height: 60px;
border: none;
border-radius: 50px;
font-size: 30px;
cursor: pointer;
background-color: #eee;
}

button.operator {  
background-color: orange;  
color: white;  
      }  
    
      button.clear {  
background-color: red;  
color: white;  
      }  
      </style>

  </head>    <body>  <div class="calculator">  <input class="display" id="display" type="text" readonly>  
   <div class="buttons">  
 <button class="clear" onclick="clearDisplay()">C</button>  
<button class="operator" onclick="addToDisplay('/')">÷</button>  
<button class="operator" onclick="addToDisplay('*')">×</button>  <button onclick ="addToDisplay('7')">7</button>  
<button onclick ="addToDisplay('8')">8</button>  
<button onclick ="addToDisplay('9')">9</button>  
<button class="operator" onclick ="addToDisplay('-')">-</button>  


<button onclick ="addToDisplay('4')">4</button>  
<button onclick ="addToDisplay('5')">5</button>  
<button onclick ="addToDisplay('6')">6</button>  
<button class ="operator" onclick ="addToDisplay('+')">+</button>  

  
<button onclick ="addToDisplay('1')">1</button>  
<button onclick ="addToDisplay('2')">2</button>  
<button onclick ="addToDisplay('3')">3</button>  

  
<button onclick ="addToDisplay('0')">0</button>  
<button onclick ="addToDisplay('.')">.</button>  
<button onclick ="calculate()">=</button>

</>

</div>  
    <script>  function addToDisplay(value) {  
    document.getElementById("display").value += value;  
}  

function clearDisplay() {  
    document.getElementById("display").value = "";  
}  

function calculate() {  
    let display = document.getElementById("display");  

    try {  
        display.value = eval(display.value);  
    } catch {  
        display.value = "Error";  
    }  
}  

</script>

  </body>  
  </html>
